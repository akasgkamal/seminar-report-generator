<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seminar Report Generator - GPTC Kalamassery</title>
  <style>
    :root {
      --serif: "Times New Roman", Times, serif;
    }
    * { box-sizing: border-box; }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #2b303c;
      font-family: var(--serif);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Mobile Navigation Bar */
    .mobile-tab-bar {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #0f172a;
      z-index: 1000;
      justify-content: space-around;
      align-items: center;
      padding: 6px;
    }
    .mobile-tab-btn {
      flex: 1;
      height: 38px;
      margin: 0 4px;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .mobile-tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    /* Left Control Sidebar */
    .sidebar {
      width: 480px;
      min-width: 480px;
      background: #ffffff;
      height: 100%;
      overflow-y: auto;
      border-right: 2px solid #cbd5e1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .sidebar h2 { margin: 0; font-size: 17px; color: #0f172a; }
    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-title {
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      color: #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label { font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; margin-top: 4px; }
    input[type="text"], input[type="file"], textarea {
      width: 100%;
      padding: 7px 9px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-family: inherit;
    }
    textarea { resize: vertical; }

    .block-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }
    .btn-sm {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      color: #334155;
    }
    .btn-sm:hover { background: #e2e8f0; }
    .btn-del { color: #dc2626; border-color: #fca5a5; }
    .btn-del:hover { background: #fee2e2; }
    .btn-action { background: #e0f2fe; color: #0369a1; border-color: #bae6fd; }

    .block-item {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 8px;
      margin-top: 6px;
    }
    .block-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 11px;
      color: #64748b;
      font-weight: bold;
    }

    .btn-print {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-print:hover { background: #0369a1; }

    /* Right Preview Stage */
    .preview-stage {
      flex: 1;
      background: #475569;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    /* A4 Dimensions */
    .a4-page {
      width: 210mm;
      min-width: 210mm;
      max-width: 210mm;
      height: 297mm;
      min-height: 297mm;
      max-height: 297mm;
      background: #ffffff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      padding: 30mm 20mm 25mm 32.5mm;
      box-sizing: border-box;
      font-family: var(--serif);
      position: relative;
      display: flex;
      flex-direction: column;
      page-break-after: always;
      break-after: page;
      overflow: hidden;
    }

    .prelim-page {
      padding: 20mm 25mm 18mm 25mm !important;
    }

    .official-logo {
      width: 130px;
      height: 130px;
      margin: 0 auto 8px auto;
      display: block;
      object-fit: contain;
    }
    .logo-placeholder {
      width: 130px;
      height: 130px;
      margin: 0 auto 8px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed #94a3b8;
      border-radius: 50%;
      font-size: 10pt;
      color: #64748b;
      font-style: italic;
    }

    .page-header {
      position: absolute;
      top: 15mm;
      left: 32.5mm;
      right: 20mm;
      display: flex;
      justify-content: flex-end;
      font-size: 10.5pt;
      font-style: italic;
      border-bottom: 1px solid #000;
      padding-bottom: 3px;
      line-height: 1;
    }
    .page-footer {
      position: absolute;
      bottom: 15mm;
      left: 32.5mm;
      right: 20mm;
      display: flex;
      justify-content: space-between;
      font-size: 10.5pt;
      font-style: italic;
      border-top: 1px solid #000;
      padding-top: 3px;
      line-height: 1;
    }

    .page-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chapter-title {
      font-size: 16pt;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      margin-top: 10pt;
      margin-bottom: 14pt;
      line-height: 1.2;
    }
    .subheading-l1 {
      font-size: 13.5pt;
      font-weight: bold;
      text-transform: uppercase;
      text-align: left;
      margin-top: 12pt;
      margin-bottom: 8pt;
      line-height: 1.2;
    }
    .subheading-l2 {
      font-size: 12.5pt;
      font-weight: bold;
      text-align: left;
      margin-top: 10pt;
      margin-bottom: 6pt;
      line-height: 1.2;
    }
    .body-paragraph {
      font-size: 12pt;
      line-height: 1.5;
      text-align: justify;
      text-indent: 32px;
      margin-top: 0;
      margin-bottom: 10pt;
      word-break: break-word;
    }

    .figure-container {
      text-align: center;
      margin: 10pt 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .figure-container img {
      max-width: 90%;
      max-height: 110mm;
      object-fit: contain;
      border-radius: 2px;
    }
    .figure-caption {
      font-size: 10.5pt;
      font-weight: bold;
      margin-top: 6pt;
      text-align: center;
      line-height: 1.2;
    }

    /* Invisible Stage used to accurately compute rendered heights */
    #measureStage {
      position: absolute;
      visibility: hidden;
      top: -99999px;
      left: -99999px;
      width: calc(210mm - 52.5mm); /* 210mm - (32.5mm + 20mm) */
      box-sizing: border-box;
      font-family: var(--serif);
    }

    /* Print Setup */
    @media print {
      html, body {
        width: 210mm;
        height: auto !important;
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
      }
      .mobile-tab-bar, .sidebar, #measureStage {
        display: none !important;
      }
      .preview-stage {
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        display: block !important;
        overflow: visible !important;
      }
      .a4-page {
        margin: 0 !important;
        box-shadow: none !important;
        width: 210mm !important;
        height: 297mm !important;
        min-height: 297mm !important;
        max-height: 297mm !important;
        transform: none !important;
        page-break-before: always !important;
        break-before: page !important;
        page-break-after: always !important;
        break-after: page !important;
      }
      .a4-page:first-child {
        page-break-before: auto !important;
        break-before: auto !important;
      }
    }
  </style>
</head>
<body>

  <div class="mobile-tab-bar">
    <button class="mobile-tab-btn active" id="tabFormBtn" onclick="switchMobileTab('form')">Edit Form</button>
    <button class="mobile-tab-btn" id="tabPreviewBtn" onclick="switchMobileTab('preview')">Preview Report</button>
    <button class="mobile-tab-btn" style="background:#0284c7; color:#fff;" onclick="window.print()">Print / PDF</button>
  </div>

  <div class="sidebar" id="sidebarPanel">
    <h2>Seminar Report Generator</h2>
    <button class="btn-print" onclick="window.print()">🖨️ Print / Save as PDF</button>

    <div class="card" style="border: 2px solid #38bdf8; background: #f0f9ff;">
      <div class="card-title" style="color: #0369a1;">College Emblem Upload</div>
      <label>Choose Logo / Seal File</label>
      <input type="file" id="inEmblemFile" accept="image/*" onchange="uploadEmblem(event)">
      <span style="font-size: 11px; color: #64748b;">Upload PNG/JPG of college seal to display on Cover and Certificate pages.</span>
    </div>

    <div class="card">
      <div class="card-title">General Information</div>
      <label>Seminar Title</label>
      <input type="text" id="metaTitle" value="SMART MEDICINE DISPENSER" oninput="renderReport()">
      
      <label>Student Full Name</label>
      <input type="text" id="metaStudent" value="VYSAKH ET" oninput="renderReport()">
      
      <label>Register Number</label>
      <input type="text" id="metaReg" value="2301041382" oninput="renderReport()">

      <label>Semester</label>
      <input type="text" id="metaSem" value="Fifth" oninput="renderReport()">

      <label>Academic Year</label>
      <input type="text" id="metaYear" value="2026 – 2027" oninput="renderReport()">

      <label>Running Header Text</label>
      <input type="text" id="metaHeader" value="Seminar Report | GPTC Kalamassery" oninput="renderReport()">
    </div>

    <div class="card">
      <div class="card-title">Pre-Included: Acknowledgement</div>
      <textarea id="inAck" rows="6" oninput="reportData.acknowledgement = this.value; renderReport();"></textarea>
    </div>

    <div id="chaptersControls"></div>

    <button class="btn-sm btn-action" style="padding:10px; font-size:13px;" onclick="addChapter()">+ Add New Chapter</button>
  </div>

  <div class="preview-stage" id="previewStage"></div>
  <div id="measureStage"></div>

<script>
  let uploadedEmblemUrl = "";

  let reportData = {
    acknowledgement: `I express my heartfelt gratitude to the Almighty for all blessings in bringing this seminar to a successful completion.

I am deeply thankful to our respected Principal, Sri. Vinod E, for granting permission to conduct this seminar and for providing the necessary institutional facilities.

I extend my sincere gratitude to Sri. Akas G. Kamal, Head of Department in charge and Seminar Coordinator, for the guidance, valuable suggestions, and systematic arrangements in conducting the seminar sessions.

I convey my sincere appreciation to all faculty members, staff, and my fellow classmates for their constant encouragement.`,
    abstract: "Image retrieval is the field of study concerned with searching and browsing digital images from collections. Querying for images can be categorized into textual queries and content-based queries. This seminar report explores feature extraction, similarity computation, and relevance feedback mechanisms.",
    chapters: [
      {
        title: "Introduction to CBIR",
        blocks: [
          {
            type: "paragraph",
            content: "As processors become increasingly powerful and memories become increasingly cheaper, the deployment of large image databases for a variety of applications has now become scalable. Databases of artwork, satellite imagery, and medical imaging have attracted researchers across diverse disciplines."
          },
          {
            type: "subheading1",
            content: "What Is Content-Based Image Retrieval?"
          },
          {
            type: "paragraph",
            content: "Image retrieval is concerned with searching, browsing, and retrieving digital images from vast repositories. Visual queries evaluate colour, texture, and shape descriptors directly rather than relying on manual keyword tags."
          },
          {
            type: "figure",
            src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='260' viewBox='0 0 600 260'><rect width='600' height='260' fill='%23f1f5f9' stroke='%2394a3b8' stroke-width='2'/><text x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='Times New Roman' font-size='20' fill='%23334155'>Architecture Block Diagram</text></svg>",
            caption: "Block diagram of an automated CBIR pipeline."
          },
          {
            type: "paragraph",
            content: "The feature vectors are indexed efficiently to facilitate fast k-nearest-neighbor search across millions of candidate representations. In modern systems, deep convolutional features replace handcrafted descriptors."
          }
        ]
      },
      {
        title: "Methodology and Color Descriptors",
        blocks: [
          {
            type: "subheading1",
            content: "Color Descriptors"
          },
          {
            type: "paragraph",
            content: "In the following sections, we introduce some commonly used color descriptors including color histogram, color coherence vector, and color moments."
          },
          {
            type: "subheading2",
            content: "Color Moments"
          },
          {
            type: "paragraph",
            content: "Color moments have been successfully used in many retrieval systems, especially when the image contains only the object. The first order (mean), the second order (variance), and the third order moments are extracted."
          }
        ]
      }
    ]
  };

  function switchMobileTab(tab) {
    const sidebar = document.getElementById('sidebarPanel');
    const preview = document.getElementById('previewStage');
    const tabFormBtn = document.getElementById('tabFormBtn');
    const tabPreviewBtn = document.getElementById('tabPreviewBtn');

    if (tab === 'form') {
      sidebar.style.display = 'flex';
      preview.style.display = 'none';
      tabFormBtn.classList.add('active');
      tabPreviewBtn.classList.remove('active');
    } else {
      sidebar.style.display = 'none';
      preview.style.display = 'flex';
      tabFormBtn.classList.remove('active');
      tabPreviewBtn.classList.add('active');
    }
  }

  function uploadEmblem(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        uploadedEmblemUrl = evt.target.result;
        renderReport();
      };
      reader.readAsDataURL(file);
    }
  }

  function getEmblemRenderHtml() {
    if (uploadedEmblemUrl && uploadedEmblemUrl.trim() !== "") {
      return `<img src="${uploadedEmblemUrl}" class="official-logo" alt="College Emblem">`;
    }
    return `<div class="logo-placeholder">Upload Emblem Above</div>`;
  }

  function addChapter() {
    reportData.chapters.push({
      title: "New Chapter",
      blocks: [{ type: "paragraph", content: "Enter chapter details here..." }]
    });
    renderControls();
    renderReport();
  }

  function removeChapter(cIdx) {
    reportData.chapters.splice(cIdx, 1);
    renderControls();
    renderReport();
  }

  function addBlock(cIdx, type) {
    if (type === 'figure') {
      reportData.chapters[cIdx].blocks.push({
        type: 'figure',
        src: 'https://via.placeholder.com/600x300?text=Insert+Diagram',
        caption: 'Figure description'
      });
    } else {
      reportData.chapters[cIdx].blocks.push({ type, content: type.includes('subheading') ? 'New Subheading' : 'New paragraph content...' });
    }
    renderControls();
    renderReport();
  }

  function removeBlock(cIdx, bIdx) {
    reportData.chapters[cIdx].blocks.splice(bIdx, 1);
    renderControls();
    renderReport();
  }

  function handleFigureUpload(event, cIdx, bIdx) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        reportData.chapters[cIdx].blocks[bIdx].src = evt.target.result;
        renderReport();
      };
      reader.readAsDataURL(file);
    }
  }

  function renderControls() {
    document.getElementById('inAck').value = reportData.acknowledgement;
    const container = document.getElementById('chaptersControls');
    container.innerHTML = '';

    reportData.chapters.forEach((chap, cIdx) => {
      const card = document.createElement('div');
      card.className = 'card';

      let blocksHtml = chap.blocks.map((b, bIdx) => {
        if (b.type === 'paragraph') {
          return `
            <div class="block-item">
              <div class="block-item-header">
                <span>Paragraph</span>
                <button class="btn-sm btn-del" onclick="removeBlock(${cIdx}, ${bIdx})">Delete</button>
              </div>
              <textarea rows="3" oninput="reportData.chapters[${cIdx}].blocks[${bIdx}].content = this.value; renderReport();">${b.content}</textarea>
            </div>
          `;
        } else if (b.type === 'subheading1') {
          return `
            <div class="block-item">
              <div class="block-item-header">
                <span>Subheading 1 (e.g. 1.1)</span>
                <button class="btn-sm btn-del" onclick="removeBlock(${cIdx}, ${bIdx})">Delete</button>
              </div>
              <input type="text" value="${b.content}" oninput="reportData.chapters[${cIdx}].blocks[${bIdx}].content = this.value; renderReport();">
            </div>
          `;
        } else if (b.type === 'subheading2') {
          return `
            <div class="block-item">
              <div class="block-item-header">
                <span>Subheading 2 (e.g. 1.1.1)</span>
                <button class="btn-sm btn-del" onclick="removeBlock(${cIdx}, ${bIdx})">Delete</button>
              </div>
              <input type="text" value="${b.content}" oninput="reportData.chapters[${cIdx}].blocks[${bIdx}].content = this.value; renderReport();">
            </div>
          `;
        } else if (b.type === 'figure') {
          return `
            <div class="block-item">
              <div class="block-item-header">
                <span>Figure / Diagram</span>
                <button class="btn-sm btn-del" onclick="removeBlock(${cIdx}, ${bIdx})">Delete</button>
              </div>
              <label>Replace Image</label>
              <input type="file" accept="image/*" onchange="handleFigureUpload(event, ${cIdx}, ${bIdx})">
              <label>Caption</label>
              <input type="text" value="${b.caption}" oninput="reportData.chapters[${cIdx}].blocks[${bIdx}].caption = this.value; renderReport();">
            </div>
          `;
        }
      }).join('');

      card.innerHTML = `
        <div class="card-title">
          <span>Chapter ${cIdx + 1}</span>
          <button class="btn-sm btn-del" onclick="removeChapter(${cIdx})">Remove Chapter</button>
        </div>
        <label>Chapter Title</label>
        <input type="text" value="${chap.title}" oninput="reportData.chapters[${cIdx}].title = this.value; renderReport();">
        <div class="block-toolbar">
          <button class="btn-sm" onclick="addBlock(${cIdx}, 'paragraph')">+ Paragraph</button>
          <button class="btn-sm" onclick="addBlock(${cIdx}, 'subheading1')">+ Subheading 1</button>
          <button class="btn-sm" onclick="addBlock(${cIdx}, 'subheading2')">+ Subheading 2</button>
          <button class="btn-sm" onclick="addBlock(${cIdx}, 'figure')">+ Figure</button>
        </div>
        ${blocksHtml}
      `;
      container.appendChild(card);
    });
  }

  // Pre-calculate DOM height for arbitrary content block
  function measureBlockHeight(html) {
    const stage = document.getElementById('measureStage');
    stage.innerHTML = html;
    const height = stage.offsetHeight;
    stage.innerHTML = '';
    return height;
  }

  function buildPageTemplate(pageNumber, headerText, isPreliminary) {
    const page = document.createElement('div');
    page.className = `a4-page ${isPreliminary ? 'prelim-page' : ''}`;

    if (!isPreliminary) {
      const header = document.createElement('div');
      header.className = 'page-header';
      header.innerText = headerText;
      page.appendChild(header);

      const footer = document.createElement('div');
      footer.className = 'page-footer';
      footer.innerHTML = `<span>GPTC Kalamassery</span><span>${pageNumber}</span>`;
      page.appendChild(footer);
    }

    const contentArea = document.createElement('div');
    contentArea.className = 'page-content';
    page.appendChild(contentArea);

    return { page, contentArea };
  }

  function renderReport() {
    const preview = document.getElementById('previewStage');
    preview.innerHTML = '';

    const meta = {
      title: document.getElementById('metaTitle').value,
      student: document.getElementById('metaStudent').value,
      reg: document.getElementById('metaReg').value,
      sem: document.getElementById('metaSem').value,
      year: document.getElementById('metaYear').value,
      header: document.getElementById('metaHeader').value
    };

    // 1. Cover Page
    const cover = document.createElement('div');
    cover.className = 'a4-page prelim-page';
    cover.innerHTML = `
      <div class="page-content" style="text-align: center; justify-content: space-between;">
        <div>
          <div style="font-size: 14pt; font-weight: bold; letter-spacing: 1px;">A SEMINAR REPORT ON</div>
          <div style="font-size: 18pt; font-weight: bold; margin-top: 15px; color: #0f172a; text-transform: uppercase;">${meta.title}</div>
        </div>
        <div>
          ${getEmblemRenderHtml()}
          <div style="font-size: 12pt; margin-top: 15px;">Submitted by</div>
          <div style="font-size: 14pt; font-weight: bold; text-transform: uppercase;">${meta.student}</div>
          <div style="font-size: 12pt;">Reg. No: <b>${meta.reg}</b></div>
        </div>
        <div>
          <div style="font-size: 12pt;">In partial fulfillment of the requirements for the award of Diploma in</div>
          <div style="font-size: 13pt; font-weight: bold; margin-top: 5px;">ELECTRONICS AND COMMUNICATION ENGINEERING</div>
          <div style="font-size: 11pt; margin-top: 15px; font-weight: bold;">DEPARTMENT OF TECHNICAL EDUCATION, KERALA</div>
          <div style="font-size: 13pt; font-weight: bold;">GOVT. POLYTECHNIC COLLEGE, KALAMASSERY</div>
          <div style="font-size: 11pt; margin-top: 5px;">${meta.year}</div>
        </div>
      </div>
    `;
    preview.appendChild(cover);

    // 2. Acknowledgement Page
    const ackPage = document.createElement('div');
    ackPage.className = 'a4-page prelim-page';
    ackPage.innerHTML = `
      <div class="page-content">
        <div class="chapter-title" style="margin-top: 20pt;">ACKNOWLEDGEMENT</div>
        ${reportData.acknowledgement.split('\n\n').map(p => `<p class="body-paragraph">${p}</p>`).join('')}
        <div style="margin-top: 40px; display: flex; justify-content: flex-end;">
          <div style="text-align: center;">
            <div style="font-weight: bold;">${meta.student}</div>
            <div>Reg. No: ${meta.reg}</div>
          </div>
        </div>
      </div>
    `;
    preview.appendChild(ackPage);

    // 3. Dynamic Chapter Pages with Automatic Spanning
    let currentPageNum = 1;
    
    // Total usable height in pixels for A4 body content (297mm - margins)
    // 297mm - 30mm (top) - 25mm (bottom) = 242mm ≈ ~914px at 96 DPI
    const MAX_PAGE_CONTENT_HEIGHT = 880; 

    reportData.chapters.forEach((chap, cIdx) => {
      let chapterNum = cIdx + 1;
      let l1Counter = 0;
      let l2Counter = 0;

      let { page, contentArea } = buildPageTemplate(currentPageNum, meta.header, false);
      preview.appendChild(page);

      // Chapter Title Block
      const chapterHeaderHtml = `
        <div class="chapter-title">
          CHAPTER ${chapterNum}<br>${chap.title}
        </div>
      `;
      contentArea.innerHTML = chapterHeaderHtml;
      let currentHeight = measureBlockHeight(chapterHeaderHtml);

      chap.blocks.forEach((block) => {
        let blockHtml = '';

        if (block.type === 'paragraph') {
          blockHtml = `<p class="body-paragraph">${block.content}</p>`;
        } else if (block.type === 'subheading1') {
          l1Counter++;
          l2Counter = 0;
          blockHtml = `<div class="subheading-l1">${chapterNum}.${l1Counter} ${block.content}</div>`;
        } else if (block.type === 'subheading2') {
          l2Counter++;
          blockHtml = `<div class="subheading-l2">${chapterNum}.${l1Counter}.${l2Counter} ${block.content}</div>`;
        } else if (block.type === 'figure') {
          blockHtml = `
            <div class="figure-container">
              <img src="${block.src}" alt="${block.caption}">
              <div class="figure-caption">Figure: ${block.caption}</div>
            </div>
          `;
        }

        const blockHeight = measureBlockHeight(blockHtml);

        // If the block overflows the current page, split onto the next page
        if (currentHeight + blockHeight > MAX_PAGE_CONTENT_HEIGHT) {
          currentPageNum++;
          const next = buildPageTemplate(currentPageNum, meta.header, false);
          preview.appendChild(next.page);

          page = next.page;
          contentArea = next.contentArea;
          currentHeight = 0;
        }

        contentArea.insertAdjacentHTML('beforeend', blockHtml);
        currentHeight += blockHeight;
      });

      // Prepare next page index
      currentPageNum++;
    });
  }

  // Initialize
  window.onload = function() {
    renderControls();
    renderReport();
  };
</script>
</body>
</html>
