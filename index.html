<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seminar Report Generator - GPTC Kalamassery</title>
  <style>
    :root {
      --serif: "Times New Roman", Times, serif;
    }
    * { box-sizing: border-box; }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #2b303c;
      font-family: var(--serif);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Mobile Navigation Bar */
    .mobile-tab-bar {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #0f172a;
      z-index: 1000;
      justify-content: space-around;
      align-items: center;
      padding: 6px;
    }
    .mobile-tab-btn {
      flex: 1;
      height: 38px;
      margin: 0 4px;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .mobile-tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    /* Left Control Sidebar */
    .sidebar {
      width: 480px;
      min-width: 480px;
      background: #ffffff;
      height: 100%;
      overflow-y: auto;
      border-right: 2px solid #cbd5e1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .sidebar h2 { margin: 0; font-size: 17px; color: #0f172a; }
    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-title {
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      color: #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label { font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; }
    input[type="text"], input[type="file"], textarea {
      width: 100%;
      padding: 7px 9px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-family: inherit;
    }
    textarea { resize: vertical; }

    .block-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 4px;
    }
    .btn-sm {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      color: #334155;
    }
    .btn-sm:hover { background: #e2e8f0; }
    .btn-del { color: #dc2626; border-color: #fca5a5; }
    .btn-del:hover { background: #fee2e2; }
    .btn-action { background: #e0f2fe; color: #0369a1; border-color: #bae6fd; }

    .block-item {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 8px;
      margin-top: 6px;
    }
    .block-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 11px;
      color: #64748b;
      font-weight: bold;
    }

    .btn-print {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-print:hover { background: #0369a1; }

    /* Right Preview Stage */
    .preview-stage {
      flex: 1;
      background: #475569;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    /* Standard A4 Screen & Print Dimensions */
    .a4-page {
      width: 210mm;
      min-width: 210mm;
      max-width: 210mm;
      height: 297mm;
      min-height: 297mm;
      max-height: 297mm;
      background: #ffffff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      /* Kalamassery Report Margins: Top 30mm, Right 20mm, Bottom 25mm, Left 32.5mm */
      padding: 30mm 20mm 25mm 32.5mm;
      box-sizing: border-box;
      font-family: var(--serif);
      position: relative;
      display: flex;
      flex-direction: column;
      page-break-after: always;
      break-after: page;
      page-break-inside: avoid;
      break-inside: avoid;
      overflow: hidden;
    }

    /* Preliminary Pages Margin (Cover & Certificate) */
    .prelim-page {
      padding: 20mm 25mm 18mm 25mm !important;
    }

    /* 50% Enlarged Emblem */
    .official-logo {
      width: 142px;
      height: 142px;
      margin: 0 auto 8px auto;
      display: block;
      object-fit: contain;
    }
    .logo-placeholder {
      width: 142px;
      height: 142px;
      margin: 0 auto 8px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed #94a3b8;
      border-radius: 50%;
      font-size: 10pt;
      color: #64748b;
      font-style: italic;
    }

    /* Running Header & Footer for Chapter Pages */
    .page-header {
      position: absolute;
      top: 15mm;
      left: 32.5mm;
      right: 20mm;
      display: flex;
      justify-content: flex-end;
      font-size: 11pt;
      font-style: italic;
      border-bottom: 1px solid #000;
      padding-bottom: 3px;
      line-height: 1;
    }
    .page-footer {
      position: absolute;
      bottom: 15mm;
      left: 32.5mm;
      right: 20mm;
      display: flex;
      justify-content: space-between;
      font-size: 11pt;
      font-style: italic;
      border-top: 1px solid #000;
      padding-top: 3px;
      line-height: 1;
    }

    .page-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Typography Specifications */
    .chapter-title {
      font-size: 16pt;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      margin-top: 12pt;
      margin-bottom: 12pt;
      line-height: 1.2;
    }
    .subheading-l1 {
      font-size: 14pt;
      font-weight: bold;
      text-transform: uppercase;
      text-align: left;
      margin-top: 10pt;
      margin-bottom: 10pt;
      line-height: 1;
    }
    .subheading-l2 {
      font-size: 14pt;
      font-weight: bold;
      text-align: left;
      margin-top: 10pt;
      margin-bottom: 10pt;
      line-height: 1;
    }
    .body-paragraph {
      font-size: 12pt;
      line-height: 1.5;
      text-align: justify;
      text-indent: 35px;
      margin-top: 0;
      margin-bottom: 10pt;
    }

    .figure-container {
      text-align: center;
      margin: 6pt 0;
      max-height: 110mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .figure-container img {
      max-width: 85%;
      max-height: 95mm;
      object-fit: contain;
    }
    .figure-caption {
      font-size: 10pt;
      font-weight: bold;
      margin-top: 6pt;
      margin-bottom: 6pt;
      text-align: center;
      line-height: 1.2;
    }

    /* Table of Contents */
    .toc-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 6px;
    }
    .toc-title {
      background: white;
      padding-right: 6px;
      z-index: 1;
    }
    .toc-leader {
      flex: 1;
      border-bottom: 1px dotted #000;
      margin-bottom: 4px;
    }
    .toc-page {
      background: white;
      padding-left: 6px;
      z-index: 1;
    }

    /* Responsive Mobile and Tablet Rules */
    @media screen and (max-width: 1024px) {
      body {
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      .mobile-tab-bar {
        display: flex;
      }
      .sidebar {
        width: 100%;
        min-width: 100%;
        height: calc(100vh - 50px);
        margin-top: 50px;
        border-right: none;
        padding: 15px;
        display: flex;
      }
      .preview-stage {
        width: 100%;
        height: calc(100vh - 50px);
        margin-top: 50px;
        padding: 15px 5px;
        display: none;
        overflow-x: auto;
      }
      .a4-page {
        transform-origin: top center;
        transform: scale(0.48);
        margin-bottom: -140mm;
      }
    }

    @media screen and (max-width: 480px) {
      .a4-page {
        transform: scale(0.42);
        margin-bottom: -165mm;
      }
    }

    /* Strict Desktop & Mobile Print to PDF Rules */
    @media print {
      html, body {
        width: 210mm;
        height: auto !important;
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
      }
      .mobile-tab-bar, .sidebar {
        display: none !important;
      }
      .preview-stage {
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        display: block !important;
        overflow: visible !important;
      }
      .a4-page {
        margin: 0 !important;
        box-shadow: none !important;
        width: 210mm !important;
        height: 297mm !important;
        min-height: 297mm !important;
        max-height: 297mm !important;
        transform: none !important;
        page-break-before: always !important;
        break-before: page !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .a4-page:first-child {
        page-break-before: auto !important;
        break-before: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- Mobile Top Switcher -->
  <div class="mobile-tab-bar">
    <button class="mobile-tab-btn active" id="tabFormBtn" onclick="switchMobileTab('form')">Edit Form</button>
    <button class="mobile-tab-btn" id="tabPreviewBtn" onclick="switchMobileTab('preview')">Preview Report</button>
    <button class="mobile-tab-btn" style="background:#0284c7; color:#fff;" onclick="window.print()">Print / PDF</button>
  </div>

  <!-- Controls Sidebar -->
  <div class="sidebar" id="sidebarPanel">
    <h2>Seminar Report Generator</h2>
    <button class="btn-print" onclick="window.print()">🖨️ Print / Save as PDF</button>

    <!-- Upload Provision for College Emblem -->
    <div class="card" style="border: 2px solid #38bdf8; background: #f0f9ff;">
      <div class="card-title" style="color: #0369a1;">College Emblem Upload</div>
      <label>Choose Logo / Seal File</label>
      <input type="file" id="inEmblemFile" accept="image/*" onchange="uploadEmblem(event)">
      <span style="font-size: 11px; color: #64748b;">Upload PNG/JPG of college seal to display on Cover and Certificate pages[cite: 5, 6].</span>
    </div>

    <div class="card">
      <div class="card-title">General Information</div>
      <label>Seminar Title</label>
      <input type="text" id="metaTitle" value="SMART MEDICINE DISPENSER" oninput="renderReport()">
      
      <label>Student Full Name</label>
      <input type="text" id="metaStudent" value="VYSAKH ET" oninput="renderReport()">
      
      <label>Register Number</label>
      <input type="text" id="metaReg" value="2301041382" oninput="renderReport()">

      <label>Semester</label>
      <input type="text" id="metaSem" value="Fifth" oninput="renderReport()">

      <label>Academic Year</label>
      <input type="text" id="metaYear" value="2026 – 2027" oninput="renderReport()">

      <label>Running Header Text</label>
      <input type="text" id="metaHeader" value="Main Project Report Format" oninput="renderReport()">
    </div>

    <!-- Acknowledgement Card -->
    <div class="card">
      <div class="card-title">Pre-Included: Acknowledgement</div>
      <textarea id="inAck" rows="8" oninput="reportData.acknowledgement = this.value; renderReport();"></textarea>
    </div>

    <!-- Chapters Container -->
    <div id="chaptersControls"></div>
  </div>

  <!-- Preview Area -->
  <div class="preview-stage" id="previewStage"></div>

<script>
  let uploadedEmblemUrl = "";

  // Structured Data with Sri. Akas G. Kamal acknowledged as HOD i/c & Coordinator
  let reportData = {
    acknowledgement: `I express my heartfelt gratitude to the Almighty for all blessings in bringing this seminar to a successful completion.

I am deeply thankful to our respected Principal, Sri. Vinod E, for granting permission to conduct this seminar and for providing the necessary institutional facilities.

I extend my sincere gratitude to Sri. Akas G. Kamal, Head of Department in charge and Seminar Coordinator, for the guidance, valuable suggestions, and systematic arrangements in conducting the seminar sessions.

I also place on record my sincere thanks to Smt. Sunitha E. S., former Head of Department in charge and Seminar Coordinator, for initiating the seminar activities and extending initial support.

I convey my sincere appreciation to all the faculty and staff members of the Department of Electronics and Communication Engineering, as well as my fellow classmates, for their constant encouragement and cooperation throughout this work.`,
    abstract: "Image retrieval is the field of study concerned with searching and browsing digital images from a collection of databases. Querying for images can be categorized into two broad formats: textual queries and content-based queries. This seminar report explores feature extraction, similarity computation, and relevance feedback mechanisms.",
    references: [
      "[1] D. Patterson and A. Waterman, The RISC-V Reader: An Open Architecture Atlas, 2017.",
      "[2] K. Asanovic, 'Instruction Sets Should Be Free: The Case for RISC-V,' UC Berkeley EECS, 2014.",
      "[3] IEEE Standards Association, 'Standard for Open-Source Hardware Verification,' IEEE Micro, 2022."
    ],
    chapters: [
      {
        title: "Introduction to CBIR",
        blocks: [
          {
            type: "paragraph",
            content: "As processors become increasingly powerful and memories become increasingly cheaper, the deployment of large image databases for a variety of applications has now become scalable. Databases of art work, satellite and medical imagery have been attracting more and more users in various professional fields."
          },
          {
            type: "subheading1",
            content: "What Is Content Based Image Retrieval?"
          },
          {
            type: "paragraph",
            content: "Image retrieval is the field of study concerned with searching, browsing, and retrieving digital images from a collection of databases. Querying for images from large and varied image databases can be categorized into two broad formats."
          },
          {
            type: "figure",
            src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='150' viewBox='0 0 400 150'><rect width='400' height='150' fill='%23f1f5f9'/><text x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='Times New Roman' font-size='16' fill='%23334155'>Block Diagram Placeholder</text></svg>",
            caption: "Query by example and keyword retrieval interface."
          }
        ]
      },
      {
        title: "Methodology and Color Descriptors",
        blocks: [
          {
            type: "subheading1",
            content: "Color Descriptors"
          },
          {
            type: "paragraph",
            content: "In the following sections, we introduce some commonly used color descriptors including color histogram, color coherence vector, and color moments."
          },
          {
            type: "subheading2",
            content: "Color Moments"
          },
          {
            type: "paragraph",
            content: "Color moments have been successfully used in many retrieval systems, especially when the image contains only the object. The first order (mean), the second order (variance), and the third order moments are extracted."
          }
        ]
      },
      {
        title: "Conclusion and Future Scope",
        blocks: [
          {
            type: "paragraph",
            content: "In this seminar report, content-based image retrieval techniques have been analyzed. A relevance feedback mechanism effectively bridges the semantic gap between low-level visual features and high-level user perception."
          }
        ]
      }
    ]
  };

  function toTitleCase(str) {
    return str.replace(/\w\S*/g, function(txt){
      return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
    });
  }

  // Mobile Tab Toggle
  function switchMobileTab(tab) {
    const sidebar = document.getElementById('sidebarPanel');
    const preview = document.getElementById('previewStage');
    const tabFormBtn = document.getElementById('tabFormBtn');
    const tabPreviewBtn = document.getElementById('tabPreviewBtn');

    if (tab === 'form') {
      sidebar.style.display = 'flex';
      preview.style.display = 'none';
      tabFormBtn.classList.add('active');
      tabPreviewBtn.classList.remove('active');
    } else {
      sidebar.style.display = 'none';
      preview.style.display = 'flex';
      tabFormBtn.classList.remove('active');
      tabPreviewBtn.classList.add('active');
    }
  }

  // Handle Emblem Upload
  function uploadEmblem(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        uploadedEmblemUrl = evt.target.result;
        renderReport();
      };
      reader.readAsDataURL(file);
    }
  }

  function getEmblemRenderHtml() {
    if (uploadedEmblemUrl && uploadedEmblemUrl.trim() !== "") {
      return `<img src="${uploadedEmblemUrl}" class="official-logo" alt="College Emblem">`;
    }
    return `<div class="logo-placeholder">Upload Seal Above</div>`;
  }

  function renderControls() {
    document.getElementById('inAck').value = reportData.acknowledgement;

    const container = document.getElementById('chaptersControls');
    container.innerHTML = '';

    // Abstract Card
    const absCard = document.createElement('div');
    absCard.className = 'card';
    absCard.innerHTML = `
      <div class="card-title">Pre-Included: Abstract</div>
      <textarea rows="4" oninput="reportData.abstract = this.value; renderReport();">${reportData.abstract}</textarea>
    `;
    container.appendChild(absCard);

    // Dynamic Chapters Cards
    reportData.chapters.forEach((chap, cIdx) => {
      const card = document.createElement('div');
      card.className = 'card';

      let blocksHtml = chap.blocks.map((b, bIdx) => {
        if (b.type === 'paragraph') {
          return `
            <div class="block-item">
              <div class="block-item-header">
                <span>Paragraph</span>
                <button class="btn-sm btn-del" onclick="removeBlock(${cIdx}, ${bIdx})">Remove</button>
              </div>
              <textarea rows="3" oninput="reportData.chapters[${cIdx}].blocks[${bIdx}].content = this.value; renderReport();">${b.content}</textarea>
            </div>
          `;
        } else if (b.type === 'subheading1') {
          return `
            <div class="block-item">
              <div class="block-item-header">
                <span>First Subheading (1.1, 2.1...)[cite: 1]</span>
                <button class="btn-sm btn-del" onclick="removeBlock(${cIdx}, ${bIdx})">Remove</button>
              </div>
              <input type="text" value="${b.content}" oninput="reportData.chapters[${cIdx}].blocks[${bIdx}].content = this.value; renderReport();">
            </div>
          `;
        } else if (b.type === 'subheading2') {
          return `
            <div class="block-item">
              <div class="block-item-header">
                <span>Second Subheading (1.1.1, 2.1.1...)[cite: 1]</span>
                <button class="btn-sm btn-del" onclick="removeBlock(${cIdx}, ${bIdx})">Remove</button>
              </div>
              <input type="text" value="${b.content}" oninput="reportData.chapters[${cIdx}].blocks[${bIdx}].content = this.value; renderReport();">
            </div>
          `;
        } else if (b.type === 'figure') {
          return `
            <div class="block-item">
              <div class="block-item-header">
                <span>Figure</span>
                <button class="btn-sm btn-del" onclick="removeBlock(${cIdx}, ${bIdx})">Remove</button>
              </div>
              <input type="file" accept="image/*" onchange="uploadImage(event, ${cIdx}, ${bIdx})">
              <label style="margin-top:4px; display:block;">Caption:</label>
              <input type="text" value="${b.caption}" placeholder="Name of the figure" oninput="reportData.chapters[${cIdx}].blocks[${bIdx}].caption = this.value; renderReport();">
            </div>
          `;
        }
      }).join('');

      card.innerHTML = `
        <div class="card-title">
          <span>Chapter ${cIdx + 1}</span>
          <div>
            <button class="btn-sm btn-action" title="Insert chapter above" onclick="insertChapter(${cIdx})">+ Add Above</button>
            <button class="btn-sm btn-action" title="Insert chapter below" onclick="insertChapter(${cIdx + 1})">+ Add Below</button>
            ${reportData.chapters.length > 1 ? `<button class="btn-sm btn-del" onclick="deleteChapter(${cIdx})">Delete</button>` : ''}
          </div>
        </div>
        <label>Chapter Heading</label>
        <input type="text" value="${chap.title}" oninput="reportData.chapters[${cIdx}].title = this.value; renderReport();">
        
        <div style="font-size:11px; font-weight:bold; margin-top:8px;">Add Modular Content:</div>
        <div class="block-toolbar">
          <button class="btn-sm" onclick="addBlock(${cIdx}, 'paragraph')">+ Paragraph</button>
          <button class="btn-sm" onclick="addBlock(${cIdx}, 'subheading1')">+ Subheading 1</button>
          <button class="btn-sm" onclick="addBlock(${cIdx}, 'subheading2')">+ Subheading 2</button>
          <button class="btn-sm" onclick="addBlock(${cIdx}, 'figure')">+ Figure</button>
        </div>
        <div>${blocksHtml}</div>
      `;
      container.appendChild(card);
    });

    // References Card
    const refCard = document.createElement('div');
    refCard.className = 'card';
    refCard.innerHTML = `
      <div class="card-title">Pre-Included: References</div>
      <textarea rows="4" placeholder="One reference per line" oninput="reportData.references = this.value.split('\\n'); renderReport();">${reportData.references.join('\n')}</textarea>
    `;
    container.appendChild(refCard);
  }

  function addBlock(cIdx, type) {
    if (type === 'paragraph') reportData.chapters[cIdx].blocks.push({ type, content: "New paragraph body text..." });
    if (type === 'subheading1') reportData.chapters[cIdx].blocks.push({ type, content: "New Sub-topic Heading" });
    if (type === 'subheading2') reportData.chapters[cIdx].blocks.push({ type, content: "Detailed Section Analysis" });
    if (type === 'figure') reportData.chapters[cIdx].blocks.push({ type, src: "", caption: "Name of the figure." });
    renderControls();
    renderReport();
  }

  function removeBlock(cIdx, bIdx) {
    reportData.chapters[cIdx].blocks.splice(bIdx, 1);
    renderControls();
    renderReport();
  }

  function insertChapter(positionIndex) {
    reportData.chapters.splice(positionIndex, 0, {
      title: "New Chapter Title",
      blocks: [{ type: "paragraph", content: "Write chapter contents here..." }]
    });
    renderControls();
    renderReport();
  }

  function deleteChapter(idx) {
    reportData.chapters.splice(idx, 1);
    renderControls();
    renderReport();
  }

  function uploadImage(e, cIdx, bIdx) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        reportData.chapters[cIdx].blocks[bIdx].src = evt.target.result;
        renderReport();
      };
      reader.readAsDataURL(file);
    }
  }

  function renderReport() {
    const stage = document.getElementById('previewStage');
    stage.innerHTML = '';

    const title = document.getElementById('metaTitle').value;
    const student = document.getElementById('metaStudent').value;
    const reg = document.getElementById('metaReg').value;
    const sem = document.getElementById('metaSem').value;
    const year = document.getElementById('metaYear').value;
    const headerText = document.getElementById('metaHeader').value;

    function createHeaderFooter(pageLabel) {
      return `
        <div class="page-header">
          <span>${headerText}</span>
        </div>
        <div class="page-footer">
          <span>Dept. of ECE, GPTC Kalamassery</span>
          <span>Page ${pageLabel}</span>
        </div>
      `;
    }

    const emblemHtml = getEmblemRenderHtml();

    // AUTO-ADJUST FONT SIZE FOR LONG TITLES
    let titleLength = title.trim().length;
    let coverTitleSize = "24pt";
    let coverTitleLH = "1.25";

    if (titleLength > 80) {
      coverTitleSize = "16pt";
      coverTitleLH = "1.15";
    } else if (titleLength > 45) {
      coverTitleSize = "19pt";
      coverTitleLH = "1.2";
    }

    // 1. EXACT COVER PAGE[cite: 4, 5, 7]
    const coverPage = document.createElement('div');
    coverPage.className = 'a4-page prelim-page';
    coverPage.innerHTML = `
      <div style="height: 100%; display: flex; flex-direction: column; justify-content: space-between; text-align: center;">
        <div>
          ${emblemHtml}
          <div style="font-size: 20pt; font-weight: bold; line-height: 1.25; letter-spacing: 0.5px;">
            GOVERNMENT POLYTECHNIC COLLEGE<br>KALAMASSERY
          </div>
        </div>

        <div style="margin: 2mm 0; max-height: 42mm; display: flex; flex-direction: column; justify-content: center;">
          <div style="font-size: 18pt; font-weight: bold; letter-spacing: 1px;">SEMINAR REPORT</div>
          <div style="font-size: 14pt; font-weight: bold; margin: 6px 0;">ON</div>
          <div style="font-size: ${coverTitleSize}; font-weight: bold; text-transform: uppercase; line-height: ${coverTitleLH}; padding: 0 4mm;">
            ${title}
          </div>
        </div>

        <div>
          <p style="font-size: 12pt; font-style: italic; margin: 0; line-height: 1.45;">
            Submitted in partial fulfilment of the requirements for the award of<br>
            Diploma in Electronics and Communication Engineering<br>
            (State Board of Technical Education, Kerala)
          </p>
        </div>

        <div>
          <div style="font-size: 14pt; font-weight: bold; margin-bottom: 3px;">Submitted by</div>
          <div style="font-size: 18pt; font-weight: bold; letter-spacing: 0.5px;">${student.toUpperCase()}</div>
          <div style="font-size: 18pt; margin-top: 3px;">Reg. No. ${reg}</div>
        </div>

        <div style="margin-bottom: 2mm;">
          <div style="font-size: 15pt; font-weight: bold; line-height: 1.35; letter-spacing: 0.5px; white-space: nowrap;">
            DEPARTMENT OF ELECTRONICS AND COMMUNICATION
          </div>
          <div style="font-size: 15pt; font-weight: bold; line-height: 1.35; letter-spacing: 0.5px;">
            ENGINEERING
          </div>
          <div style="font-size: 14pt; font-weight: bold; margin-top: 5px;">${year}</div>
        </div>
      </div>
    `;
    stage.appendChild(coverPage);

    // 2. EXACT CERTIFICATE PAGE[cite: 4, 6]
    const certPage = document.createElement('div');
    certPage.className = 'a4-page prelim-page';
    certPage.innerHTML = `
      <div style="height: 100%; display: flex; flex-direction: column; justify-content: space-between; text-align: center;">
        <div>
          ${emblemHtml}
          <div style="font-size: 20pt; font-weight: bold; line-height: 1.25; letter-spacing: 0.5px;">
            GOVERNMENT POLYTECHNIC COLLEGE<br>KALAMASSERY
          </div>
          <div style="font-size: 12pt; font-weight: bold; margin-top: 8px; letter-spacing: 0.5px;">
            DEPARTMENT OF ELECTRONICS & COMMUNICATION ENGINEERING
          </div>
        </div>

        <div style="font-size: 16pt; font-weight: bold; letter-spacing: 1.5px; margin: 3mm 0 1mm 0;">
          CERTIFICATE
        </div>

        <div style="font-size: 12pt; line-height: 1.7; text-align: justify; padding: 0 1mm;">
          This is to certify that the seminar report entitled <strong>“${title.toUpperCase()}”</strong> submitted by <strong>${student}</strong> (Reg. No. ${reg}), a student of the ${sem} Semester Diploma in Electronics and Communication Engineering, is a bonafide record of the seminar work carried out during the academic year ${year} in the Department of Electronics and Communication Engineering, Government Polytechnic College, Kalamassery. This report is submitted in partial fulfilment of the requirements for the award of the Diploma in Electronics and Communication Engineering of the State Board of Technical Education, Kerala.
        </div>

        <div style="margin-top: 6mm; margin-bottom: 3mm; display: grid; grid-template-columns: 1fr 1fr; row-gap: 18mm; font-size: 11pt; font-weight: normal;">
          <div style="text-align: left; padding-left: 5mm;">Project Guide</div>
          <div style="text-align: right; padding-right: 5mm;">Head of Department</div>
          <div style="text-align: left; padding-left: 5mm;">Internal Examiner</div>
          <div style="text-align: right; padding-right: 5mm;">External Examiner</div>
        </div>
      </div>
    `;
    stage.appendChild(certPage);

    // 3. ACKNOWLEDGEMENT PAGE (Roman Numeral 'i')
    const ackPage = document.createElement('div');
    ackPage.className = 'a4-page';
    let ackParagraphs = reportData.acknowledgement.split('\n\n').map(p => `<p class="body-paragraph" style="margin-bottom: 12pt;">${p.trim()}</p>`).join('');
    ackPage.innerHTML = `
      ${createHeaderFooter('i')}
      <div class="page-content">
        <div class="chapter-title">ACKNOWLEDGEMENT</div>
        <div style="margin-top: 15pt;">
          ${ackParagraphs}
        </div>
        <div style="margin-top: auto; margin-bottom: 15mm; text-align: right; font-size: 12pt;">
          <strong>${student.toUpperCase()}</strong>
        </div>
      </div>
    `;
    stage.appendChild(ackPage);

    // 4. ABSTRACT PAGE (Roman Numeral 'ii')
    const absPage = document.createElement('div');
    absPage.className = 'a4-page';
    absPage.innerHTML = `
      ${createHeaderFooter('ii')}
      <div class="page-content">
        <div class="chapter-title">ABSTRACT</div>
        <p class="body-paragraph">${reportData.abstract}</p>
      </div>
    `;
    stage.appendChild(absPage);

    // Dynamic Table of Contents Index calculation
    let tocItems = [];
    let currentArabicPage = 1;

    reportData.chapters.forEach((chap, cIdx) => {
      const chapNum = cIdx + 1;
      const chapterPage = currentArabicPage;
      
      tocItems.push({
        num: `${chapNum}`,
        title: toTitleCase(chap.title),
        page: chapterPage,
        level: 0
      });

      let s1Count = 0;
      let s2Count = 0;
      chap.blocks.forEach(b => {
        if (b.type === 'subheading1') {
          s1Count++;
          s2Count = 0;
          tocItems.push({
            num: `${chapNum}.${s1Count}`,
            title: toTitleCase(b.content),
            page: chapterPage,
            level: 1
          });
        } else if (b.type === 'subheading2') {
          s2Count++;
          const prefix = s1Count === 0 ? `${chapNum}.1.${s2Count}` : `${chapNum}.${s1Count}.${s2Count}`;
          tocItems.push({
            num: `${prefix}`,
            title: toTitleCase(b.content),
            page: chapterPage,
            level: 2
          });
        }
      });
      currentArabicPage++;
    });

    const refPageNumber = currentArabicPage;
    tocItems.push({ num: `${reportData.chapters.length + 1}`, title: "References", page: refPageNumber, level: 0 });

    // 5. TABLE OF CONTENTS / INDEX (Roman Numeral 'iii')
    const tocPage = document.createElement('div');
    tocPage.className = 'a4-page';
    let tocRowsHtml = `
      <div class="toc-row" style="padding-left: 0px; font-size: 12pt; font-weight: bold;">
        <span class="toc-title">Acknowledgement</span>
        <span class="toc-leader"></span>
        <span class="toc-page">i</span>
      </div>
      <div class="toc-row" style="padding-left: 0px; font-size: 12pt; font-weight: bold;">
        <span class="toc-title">Abstract</span>
        <span class="toc-leader"></span>
        <span class="toc-page">ii</span>
      </div>
    `;

    tocRowsHtml += tocItems.map(item => {
      let indent = item.level === 1 ? '22px' : (item.level === 2 ? '42px' : '0px');
      let weight = item.level === 0 ? 'bold' : 'normal';
      let fontSz = item.level === 0 ? '12pt' : '11.5pt';
      return `
        <div class="toc-row" style="padding-left: ${indent}; font-size: ${fontSz}; font-weight: ${weight};">
          <span class="toc-title">${item.num}&nbsp;&nbsp;${item.title}</span>
          <span class="toc-leader"></span>
          <span class="toc-page">${item.page}</span>
        </div>
      `;
    }).join('');

    tocPage.innerHTML = `
      ${createHeaderFooter('iii')}
      <div class="page-content">
        <div class="chapter-title">TABLE OF CONTENTS</div>
        <div style="margin-top: 20px;">
          ${tocRowsHtml}
        </div>
      </div>
    `;
    stage.appendChild(tocPage);

    // 6. CHAPTER PAGES (Arabic Numbering Starting at Page 1)[cite: 1]
    let arabicPageCounter = 1;
    reportData.chapters.forEach((chap, cIdx) => {
      const chapNum = cIdx + 1;
      let sub1Count = 0;
      let sub2Count = 0;
      let figCount = 0;

      const page = document.createElement('div');
      page.className = 'a4-page';

      let innerContent = `
        ${createHeaderFooter(arabicPageCounter++)}
        <div class="page-content">
          <div class="chapter-title">CHAPTER ${chapNum}<br>${chap.title.toUpperCase()}</div>
      `;

      chap.blocks.forEach(b => {
        if (b.type === 'paragraph') {
          innerContent += `<p class="body-paragraph">${b.content}</p>`;
        } else if (b.type === 'subheading1') {
          sub1Count++;
          sub2Count = 0;
          innerContent += `<div class="subheading-l1">${chapNum}.${sub1Count} ${b.content.toUpperCase()}</div>`;
        } else if (b.type === 'subheading2') {
          sub2Count++;
          const prefix = s1Count => s1Count === 0 ? `${chapNum}.1.${sub2Count}` : `${chapNum}.${sub1Count}.${sub2Count}`;
          innerContent += `<div class="subheading-l2">${prefix(sub1Count)} ${toTitleCase(b.content)}</div>`;
        } else if (b.type === 'figure') {
          figCount++;
          const imgSrc = b.src || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="130"><rect width="300" height="130" fill="%23f8fafc"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%2394a3b8">Image Placeholder</text></svg>';
          innerContent += `
            <div class="figure-container">
              <img src="${imgSrc}" alt="Figure">
              <div class="figure-caption">Figure ${chapNum}.${figCount}: ${b.caption}</div>
            </div>
          `;
        }
      });

      innerContent += `</div>`;
      page.innerHTML = innerContent;
      stage.appendChild(page);
    });

    // 7. REFERENCES PAGE
    const refPage = document.createElement('div');
    refPage.className = 'a4-page';
    let refListHtml = reportData.references.map(r => `<div style="margin-bottom: 8pt; font-size: 12pt; text-align: justify;">${r}</div>`).join('');
    refPage.innerHTML = `
      ${createHeaderFooter(arabicPageCounter)}
      <div class="page-content">
        <div class="chapter-title">REFERENCES</div>
        <div style="line-height: 1.5; margin-top: 15pt;">
          ${refListHtml}
        </div>
      </div>
    `;
    stage.appendChild(refPage);
  }

  // Initial Run
  renderControls();
  renderReport();
</script>
</body>
</html>
